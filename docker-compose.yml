services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-food-del-local-password}
      MYSQL_DATABASE: food_del
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-food-del-local-password}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # "npm run seed" krijon tabelat dhe menune fillestare vetem nese menuja eshte bosh
    command: sh -c "npm run seed && npm start"
    environment:
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-food-del-local-password}
      DB_NAME: food_del
      JWT_SECRET: ${JWT_SECRET:-local-docker-development-secret-change-before-deploy}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_IMAGES_DIR: /app/seed-images
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/uploads
      - ./food-del/src/assets/frontend_assets:/app/seed-images:ro
    depends_on:
      mysql:
        condition: service_healthy

  storefront:
    build:
      context: ./food-del
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:
